<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão de Contratações Públicas</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:#193047;font:15px system-ui}header{background:#142f48;color:white;padding:24px}main{max-width:1160px;margin:auto;padding:22px}h1{font-size:24px;margin:0}h2{font-size:19px}section,article{background:white;border:1px solid #dbe3eb;border-radius:12px;padding:20px;margin-bottom:16px}button,input,select,textarea{font:inherit;border:1px solid #c1ceda;border-radius:7px;padding:10px}button{background:#185779;color:white;cursor:pointer}button.secondary{background:white;color:#185779}label{display:block;font-weight:600;margin:10px 0 5px}input,select,textarea{width:100%}textarea{min-height:100px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.metric{font-size:30px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#52677a;font-size:13px}progress{width:100%;accent-color:#187a80}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.task{display:flex;align-items:center;gap:10px;padding:9px;border-bottom:1px solid #eee}.task input{width:auto}.task span{flex:1}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}.scroll{overflow:auto}button.danger{background:#9c3434} [hidden]{display:none!important}</style><body><header><h1>Gestão de Contratações Públicas</h1><div>Ambiente individual • Planejamento e licitações</div></header><section id="login" style="max-width:440px;margin:30px auto"><h2>Acesso individual</h2><form id="loginform"><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button style="margin-top:12px">Entrar</button></form><p id="loginmsg" role="status"></p></section><main hidden id="app"><div class="row"><button class="secondary" onclick="logout()">Sair</button><button class="secondary" onclick="refresh()">Atualizar dados</button><span id="sync" role="status">Conectando</span></div><p class="muted">Dados no Supabase. Aguarde a confirmação de salvamento antes de sair. Evite editar o mesmo projeto em dois dispositivos simultaneamente.</p><div id="metrics" class="grid"></div><nav><button onclick="newProject()">+ Novo projeto</button><button class="secondary" onclick="backup()">Exportar backup</button><button class="secondary" onclick="document.getElementById('import').click()">Importar backup</button><input hidden type="file" id="import" accept=".json" onchange="restore(this)"></nav><section><label for="search">Buscar projetos</label><input id="search" placeholder="Objeto ou número do processo" oninput="render()"><div id="projects"></div></section><section id="editor" hidden></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const phases=['Planejamento','Pesquisa de mercado','Fase externa']; const tasks=[['DFD','PCA (quando aplicável)','ETP','Análise de riscos','TR ou projeto','Caderno de especificações','Aprovação da fase'],['Definir metodologia','Coletar fontes de preços','Analisar comparabilidade e discrepâncias','Memória de cálculo','Mapa comparativo','Validar estimativa'],['Edital','Publicação','Esclarecimentos e impugnações','Propostas','Julgamento','Habilitação','Recursos','Adjudicação','Homologação']];let projects=[];let active=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let client, user, queue=Promise.resolve(), failed=false, pending=0;function enqueue(action){pending++;$('sync').textContent='Salvando…';queue=queue.then(async()=>{try{const result=await action();if(result.error)throw result.error;if(!result.data?.length)throw Error('Nenhum registro confirmado');}catch(e){failed=true;$('sync').textContent='Falha ao salvar: '+e.message;}finally{pending--;if(!pending&&!failed)$('sync').textContent='Salvo na nuvem';}});return queue}function save(){if(!user||!active)return;const p=JSON.parse(JSON.stringify(active));const row={id:p.id,owner:user.id,title:p.name,process:p.number,category:p.kind,phase:phases[p.phase],progress:pct(p),deadline:p.deadline||null,data:p,modified:new Date().toISOString()};enqueue(()=>client.from('projects').upsert(row).select('id'));render()}function pct(p){let a=p.status.flat().filter(x=>x!=='na');return a.length?Math.round(a.filter(x=>x==='ok').length/a.length*100):0}function render(){let q=$('search').value.toLowerCase();$('metrics').innerHTML=[['Projetos',projects.length],...phases.map((s,i)=>[s,projects.filter(p=>p.phase===i).length])].map(([s,n])=>`<article><div class="muted">${s}</div><div class="metric">${n}</div></article>`).join('');$('projects').innerHTML=projects.filter(p=>(p.name+' '+p.number).toLowerCase().includes(q)).map(p=>`<article><strong>${esc(p.name)}</strong><p>${esc(p.number)} • ${phases[p.phase]} • ${esc(p.kind)}</p><progress max="100" value="${pct(p)}"></progress><p>${pct(p)}% das tarefas aplicáveis • Prazo: ${esc(p.deadline||'não definido')} ${p.deadline&&p.deadline<new Date().toLocaleDateString('sv-SE')&&pct(p)<100?' • Prazo vencido':''}</p><button onclick="openProject('${p.id}')">Abrir</button></article>`).join('')||'<p>Nenhum projeto encontrado.</p>'}function newProject(){let p={id:crypto.randomUUID(),name:'Novo projeto',number:'',kind:'Serviços',phase:0,deadline:'',notes:'',regime:'Lei 14.133/2021',status:tasks.map(t=>t.map(()=> 'todo')),quotes:[],history:[]};projects.push(p);active=p;save();openProject(p.id)}function change(k,v){active[k]=v;save()}function openProject(id){active=projects.find(p=>p.id===id);let p=active;$('editor').hidden=false;$('editor').innerHTML=`<div class="row"><h2>Ficha do projeto</h2><button class="secondary" onclick="document.getElementById('editor').hidden=true">Fechar</button></div><label>Objeto</label><input value="${esc(p.name)}" onchange="change('name',this.value)"><div class="grid"><div><label>Processo</label><input value="${esc(p.number)}" onchange="change('number',this.value)"></div><div><label>Tipo de objeto</label><select onchange="change('kind',this.value)">${['Serviços','Bens','Obras','Outros'].map(x=>`<option ${p.kind===x?'selected':''}>${x}</option>`)}</select></div><div><label>Fase atual</label><select onchange="change('phase',Number(this.value))">${phases.map((x,i)=>`<option value="${i}" ${p.phase===i?'selected':''}>${x}</option>`)}</select></div><div><label>Prazo</label><input type="date" value="${esc(p.deadline)}" onchange="change('deadline',this.value)"></div></div><label>Regime jurídico / modalidade</label><input value="${esc(p.regime)}" onchange="change('regime',this.value)">${tasks.map((t,i)=>`<h2>${phases[i]}</h2>${t.map((x,j)=>`<div class="task"><span>${x}</span><select style="width:145px" onchange="active.status[${i}][${j}]=this.value;save()">${[['todo','Pendente'],['doing','Em andamento'],['ok','Concluído'],['na','Não aplicável']].map(([v,l])=>`<option value="${v}" ${p.status[i][j]===v?'selected':''}>${l}</option>`)}</select></div>`).join('')}`).join('')}<h2>Pesquisa de preços</h2><div class="grid"><input id="item" placeholder="Item / unidade"><input id="source" placeholder="Fonte / fornecedor"><input id="date" type="date"><input id="price" type="number" min="0" step="0.01" placeholder="Preço unitário"></div><button style="margin-top:8px" onclick="addQuote()">Adicionar cotação</button><div id="quotes"></div><label>Notas, referências e documentos (links)</label><textarea onchange="change('notes',this.value)">${esc(p.notes)}</textarea><h2>Assistente de IA</h2><p>Gere um contexto para análise no ChatGPT. Revise e retire informações sigilosas antes de enviar.</p><button onclick="ai()">Gerar solicitação de análise</button><textarea id="prompt" readonly placeholder="Solicitação gerada aqui"></textarea><div class="row"><button class="secondary" onclick="copyPrompt()">Copiar solicitação</button><a href="https://chatgpt.com/" target="_blank" rel="noopener">Abrir ChatGPT</a></div><h2>Registro de atividades</h2><input id="event" placeholder="Registrar decisão ou atividade"><button onclick="addEvent()">Registrar</button><div id="history">${p.history.map(x=>`<p>${esc(x)}</p>`).join('')}</div><button class="danger" onclick="removeProject()">Excluir projeto</button>`;quotes();$('editor').scrollIntoView({behavior:'smooth'})}function addQuote(){let item=$('item').value.trim(),source=$('source').value.trim(),date=$('date').value,price=Number($('price').value);if(!item||!source||!date||!$('price').value||!Number.isFinite(price)||price<0)return alert('Preencha os campos corretamente.');active.quotes.push({item,source,date,price});save();quotes();$('price').value=''}function quotes(){let groups=Object.create(null);active.quotes.forEach(q=>(groups[q.item]??=[]).push(q.price));$('quotes').innerHTML='<div class="scroll"><table><tr><th>Item</th><th>Fonte</th><th>Data</th><th>Preço</th><th></th></tr>'+active.quotes.map((q,i)=>`<tr><td>${esc(q.item)}</td><td>${esc(q.source)}</td><td>${esc(q.date)}</td><td>${money(q.price)}</td><td><button class="secondary" onclick="active.quotes.splice(${i},1);save();quotes()">Remover</button></td></tr>`).join('')+'</table></div>'+Object.entries(groups).map(([k,a])=>{a.sort((x,y)=>x-y);let m=a.length>>1;return `<p>${esc(k)}: média ${money(a.reduce((s,v)=>s+v,0)/a.length)} • mediana ${money(a.length%2?a[m]:(a[m-1]+a[m])/2)} • ${a.length} fonte(s)</p>`}).join('')+'<p class="muted">Estatísticas descritivas, não representam automaticamente preço estimado válido.</p>'}function addEvent(){let v=$('event').value.trim();if(!v)return;active.history.push(new Date().toISOString()+' — '+v);save();$('history').innerHTML=active.history.map(x=>`<p>${esc(x)}</p>`).join('');$('event').value=''}function ai(){$('prompt').value='Analise este projeto de contratação pública. Identifique pendências, divergências, riscos, fundamentos normativos em fontes oficiais atualizadas e ações propostas. Não invente dados nem referências. Diferencie recomendações de obrigações. Dados: '+JSON.stringify(active,null,2)+'\nChecklist: '+JSON.stringify(tasks)}async function copyPrompt(){if(!$('prompt').value)ai();try{await navigator.clipboard.writeText($('prompt').value);alert('Copiado')}catch(e){$('prompt').select();alert('Selecione e copie manualmente.')}}function removeProject(){if(confirm('Excluir este projeto?')){const id=active.id;enqueue(()=>client.from('projects').delete().eq('id',id).eq('owner',user.id).select('id'));projects=projects.filter(p=>p!==active);active=null;render();$('editor').hidden=true}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(projects,null,2)],{type:'application/json'}));a.download='contratacoes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(el){try{let data=JSON.parse(await el.files[0].text());if(!Array.isArray(data)||!data.every(p=>p&&typeof p.id==='string'&&/^[a-z0-9-]+$/i.test(p.id)&&typeof p.name==='string'&&Number.isInteger(p.phase)&&p.phase>=0&&p.phase<3&&Array.isArray(p.status)&&p.status.length===3&&p.status.every((s,i)=>Array.isArray(s)&&s.length===tasks[i].length&&s.every(v=>['todo','doing','ok','na'].includes(v)))&&Array.isArray(p.quotes)&&p.quotes.every(q=>q&&typeof q.item==='string'&&Number.isFinite(q.price))&&Array.isArray(p.history)))throw Error();if(confirm('Importar projetos novos do backup, sem substituir os existentes?')){for(const p of data){if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(p.id)||projects.some(x=>x.id===p.id))continue;projects.push(p);active=p;save()}active=null;$('editor').hidden=true;render()}}catch(e){alert('Backup inválido')}el.value=''}async function refresh(){if(!user)return;await queue;if(failed){alert('Há alterações com falha. Exporte um backup antes de recarregar.');return}const result=await client.from('projects').select('id,data').eq('owner',user.id);if(result.error){$('sync').textContent=result.error.message;return}projects=result.data.map(r=>({...r.data,id:r.id}));active=null;$('editor').hidden=true;render();$('sync').textContent='Dados atualizados'}async function enter(session){user=session.user;$('login').hidden=true;$('app').hidden=false;await refresh()}async function logout(){await queue;if(failed){alert('Há alterações com falha. Exporte um backup antes de sair.');return}const r=await client.auth.signOut();if(r.error){alert(r.error.message);return}user=null;projects=[];active=null;$('editor').innerHTML='';$('editor').hidden=true;render();$('app').hidden=true;$('login').hidden=false}window.addEventListener('beforeunload',e=>{if(pending||failed){e.preventDefault();e.returnValue=''}});async function init(){try{client=supabase.createClient('https://upmktypmuogddwvw jowh.supabase.co'.replace(' ',''),'sb_publishable_GQrc0fYZ9J1hk-x-jhWB6g_oELat6ig');$('loginform').onsubmit=async e=>{e.preventDefault();$('loginmsg').textContent='Entrando…';const r=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(r.error){$('loginmsg').textContent=r.error.message;return}$('loginmsg').textContent='';await enter(r.data.session)};const r=await client.auth.getSession();if(r.data.session)await enter(r.data.session)}catch(e){$('loginmsg').textContent='Falha de conexão: '+e.message}}init();</script></body></html>
